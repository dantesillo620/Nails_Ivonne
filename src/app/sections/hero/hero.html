<section id="inicio" class="hero" aria-labelledby="hero-titulo">
  <div class="contenedor rejilla">
    <div class="texto">
      <p class="etiqueta entrada" style="--d: 0">{{ textos.etiqueta }}</p>

      <h1 id="hero-titulo" class="entrada" style="--d: 1">
        {{ textos.titulo }} <em>{{ textos.tituloEnfasis }}</em>
      </h1>

      <p class="bajada entrada" style="--d: 2">{{ textos.texto }}</p>

      <div class="botones entrada" style="--d: 3">
        <a class="btn btn-primario" routerLink="/" fragment="trabajos">
          Explorar diseños
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M12 5v14M6 13l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        @if (agenda) {
          <a class="btn btn-secundario" routerLink="/" fragment="agenda">Agendar cita</a>
        }
      </div>
    </div>

    <div class="composicion">
      <!-- Detalle de marca: silueta de uña en filete dorado -->
      <svg class="silueta" viewBox="0 0 100 132" aria-hidden="true">
        <path
          pathLength="1"
          d="M50 4C63.44 8.96 92 36.24 92 68.48L92 86C92 112.88 75.2 128 50 128C24.8 128 8 112.88 8 86L8 68.48C8 36.24 36.56 8.96 50 4Z"
        />
      </svg>

      <figure class="principal">
        <app-foto
          [imagen]="portada().principal.imagen"
          [alt]="portada().principal.alt"
          sizes="(min-width: 960px) 40vw, 88vw"
          [prioridad]="true"
        />
      </figure>

      <figure class="secundaria">
        <app-foto
          [imagen]="portada().secundaria.imagen"
          [alt]="portada().secundaria.alt"
          sizes="(min-width: 960px) 16vw, 38vw"
        />
      </figure>

      <p class="firma" aria-hidden="true">
        <span>Trabajo real</span>
        <em>{{ portada().principal.titulo }}</em>
      </p>
    </div>
  </div>
</section>
